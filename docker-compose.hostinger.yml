name: foodzone

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kathmandu
      PGTZ: Asia/Kathmandu
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # PostgreSQL stays private; this loopback port is available through an
      # SSH tunnel for guarded migration verification and maintenance.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${HOSTINGER_ENV_FILE:-.env.hostinger}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      # Prevent an accidentally copied Railway URL from bypassing the local DB.
      DATABASE_URL: ""
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/server/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    name: foodzone_postgres_data
  uploads:
    name: foodzone_uploads
  caddy_data:
    name: foodzone_caddy_data
  caddy_config:
    name: foodzone_caddy_config
