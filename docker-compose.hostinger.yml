name: foodzone

# TLS/routing note: this stack no longer runs its own Caddy. The VPS hosts
# several applications behind one shared ingress proxy (/opt/ingress) that
# owns ports 80/443; foodzone contributes /opt/ingress/sites/foodzone.caddy
# and joins the external "edge" network with its app container only. The
# database stays on the project-private network, unreachable from other
# projects. Deploying the app must keep the edge attachment — that is what
# lets the ingress reach foodzone-app-1:3000.

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kathmandu
      PGTZ: Asia/Kathmandu
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # PostgreSQL stays private; this loopback port is available through an
      # SSH tunnel for guarded migration verification and maintenance.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${HOSTINGER_ENV_FILE:-.env.hostinger}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
      # Prevent an accidentally copied Railway URL from bypassing the local DB.
      DATABASE_URL: ""
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/server/uploads
    expose:
      - "3000"
    networks:
      - default
      - edge

networks:
  default:
  # Shared with the host-wide ingress proxy; created by /opt/ingress.
  edge:
    external: true

volumes:
  postgres_data:
    name: foodzone_postgres_data
  uploads:
    name: foodzone_uploads
